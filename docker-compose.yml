services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khetha}
      POSTGRES_USER: ${POSTGRES_USER:-khetha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khetha_dev}
    ports:
      - "5432:5432"
    volumes:
      - khetha_pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/10-001_initial_schema.sql:ro
      - ./database/seed/001_demo_catalogue.sql:/docker-entrypoint-initdb.d/20-001_demo_catalogue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://khetha:khetha_dev@db:5432/khetha}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      CONTENT_SOURCE_MODE: ${CONTENT_SOURCE_MODE:-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  khetha_pgdata:
