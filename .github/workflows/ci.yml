name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: FastAPI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: PYTHONPATH=. pytest -q
      - name: Validate PostgreSQL scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          for path in (
              Path("../../database/migrations/001_initial_schema.sql"),
              Path("../../database/seed/001_demo_catalogue.sql"),
          ):
              parse_sql(path.read_text())
              print(f"Validated {path}")
          PY

  mobile:
    name: Expo checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir dist
